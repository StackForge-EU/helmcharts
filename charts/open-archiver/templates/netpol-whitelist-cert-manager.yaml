{{- if (index .Values.networkPolicyWhitelist "cert-manager").enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "open-archiver.fullname" . }}-allow-cert-manager
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      {{- include "open-archiver.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cert-manager
      ports:
        - protocol: TCP
          port: {{ (index .Values.networkPolicyWhitelist "cert-manager").port }}
{{- end }}
