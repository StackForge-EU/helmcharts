{{- if .Values.tika.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "open-archiver.fullname" . }}-tika
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "open-archiver.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "open-archiver.selectorLabelsTika" . | nindent 4 }}
  ports:
    - port: 9998
      targetPort: tika
      protocol: TCP
      name: tika
{{- end }}
